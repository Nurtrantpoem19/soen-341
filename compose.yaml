services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: careerconnect
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: careerconnect
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - careerconnect_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerconnect -d careerconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  careerconnect_data:
